<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faceit Arena OBS Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,700;1,800&display=swap');

        :root {
            --bg: rgba(10, 10, 10, 0.65);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-label: rgba(255, 255, 255, 0.45);
            --red: #F87171;
            --green: #4ADE80;
            --font: 'Montserrat', sans-serif;
            --radius: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: transparent;
            overflow: hidden;
            color: var(--text-main);
            padding: 30px;
        }

        .widget {
            width: 520px;
            background: var(--bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nickname {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            max-width: 320px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-rank {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-label);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-rank img {
            width: 16px;
            border-radius: 2px;
            filter: brightness(0.85);
        }

        .elo-block {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .elo-value {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
        }

        .level-badge {
            width: 38px;
            height: 38px;
            background: #FF4E4E;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            box-shadow: 0 0 15px rgba(255, 78, 78, 0.35);
            /* Slightly tilted for a dynamic look */
            transform: rotate(-2deg);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-label);
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 800;
        }

        /* Footer: History */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
        }

        .history-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-label);
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .history {
            display: flex;
            gap: 5px;
        }

        .match {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 900;
            transition: transform 0.2s;
        }

        .match:hover { transform: scale(1.1); }

        .match-w {
            background: rgba(74, 222, 128, 0.25);
            color: var(--green);
            border: 1px solid rgba(74, 222, 128, 0.2);
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.15);
        }

        .match-l {
            background: rgba(248, 113, 113, 0.25);
            color: var(--red);
            border: 1px solid rgba(248, 113, 113, 0.2);
            box-shadow: 0 0 10px rgba(248, 113, 113, 0.15);
        }

        .match-empty {
            background: rgba(255, 255, 255, 0.05);
            color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Loader */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 14px;
            opacity: 0.3;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="loader">Syncing...</div>

    <div id="widget" class="widget hidden">
        <div class="header">
            <div class="user-info">
                <div class="nickname" id="nickname">—</div>
                <div class="top-rank">
                    <img src="https://flagcdn.com/w20/ru.png" alt="RU">
                    <span>Rank <span id="rank-region">—</span></span>
                    <span style="opacity: 0.4;">·</span>
                    <span style="opacity: 0.7;">Global #<span id="rank-global">—</span></span>
                </div>
            </div>
            <div class="elo-block">
                <div class="elo-value" id="elo">0</div>
                <div class="level-badge" id="level">1</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-label">AVG</span>
                <span class="stat-value" id="avg-kills">0.0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">WIN %</span>
                <span class="stat-value" id="winrate">0%</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">K/D</span>
                <span class="stat-value" id="kd">0.00</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">KR</span>
                <span class="stat-value" id="kr">0.00</span>
            </div>
        </div>

        <div class="footer">
            <span class="history-label">Last Matches</span>
            <div class="history" id="history">
                <!-- Matches will be injected here -->
            </div>
        </div>
    </div>

    <script src="overlay.js"></script>
</body>
</html>
