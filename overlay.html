<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Faceit Arena OBS Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

    :root {
      --bg-glass: rgba(13, 13, 13, 0.7);
      --accent: #FFD700;
      --accent-red: #FF3B30;
      --text: #ffffff;
      --text-dim: #a0a0a0;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      color: var(--text);
    }

    .overlay-container {
      width: 380px;
      height: 120px;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      position: relative;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border-left: 4px solid var(--accent);
    }

    .rank-icon-wrap {
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .rank-emoji {
      font-size: 54px;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.4));
    }

    .level-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: var(--accent);
      color: #000;
      font-weight: 900;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 6px;
      min-width: 14px;
      text-align: center;
    }

    .info-wrap {
      flex: 1;
      margin-left: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .nickname {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .stats-row {
      display: flex;
      gap: 20px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 900;
      color: var(--text);
    }

    .accent-text {
      color: var(--accent);
    }

    /* Animations */
    .animate-in {
      animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    .loading {
        font-size: 12px;
        color: var(--text-dim);
    }
  </style>
</head>
<body>

  <div class="overlay-container animate-in" id="overlay" style="display: none;">
    <div class="rank-icon-wrap">
      <span class="rank-emoji" id="rank-emoji">👑</span>
      <span class="level-badge" id="level-badge">10</span>
    </div>
    <div class="info-wrap">
      <div class="nickname" id="nickname">PLAYERNAME</div>
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-label">ELO</span>
          <span class="stat-value accent-text" id="elo">----</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">K/D</span>
          <span class="stat-value" id="kd">-.--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Win Rate</span>
          <span class="stat-value" id="winrate">--%</span>
        </div>
      </div>
    </div>
  </div>

  <div id="status" style="padding: 20px; font-family: sans-serif; color: white;">
    Подключение...
  </div>

  <script src="overlay.js"></script>
</body>
</html>
